# Render Blueprint: https://render.com/docs/blueprint-spec
services:
  - type: web
    name: outspoken
    runtime: node
    plan: free
    branch: claude/rea-skill-1fbw70
    buildCommand: cd server && npm ci
    startCommand: cd server && npm start
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: "22"
      # Secrets: enter these in the Render dashboard, never in this file.
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: ELEVENLABS_API_KEY
        sync: false
